name: Build and Deploy Hastina Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Monorepo Dependencies
      run: npm ci

    - name: Build API & Prisma Client
      run: |
        npm run prisma:generate --workspace=@hastina/api
        npm run build --workspace=@hastina/api

    - name: Build Web Application
      run: npm run build --workspace=@hastina/web

  deploy-vps:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy via SSH to Ubuntu VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/hastinamotorparts
          git pull origin main
          docker compose down
          docker compose up --build -d
          docker compose exec -T api npx prisma migrate deploy
