version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hastina_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hastina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hastina_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hastina_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hastina_user} -d ${POSTGRES_DB:-hastina_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hastina_network

  # 2. Meilisearch Engine
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: hastina_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-hastina_meili_master_key_2026}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - hastina_network

  # 3. Express REST API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hastina_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hastina_user}:${POSTGRES_PASSWORD:-hastina_secret_2026}@postgres:5432/${POSTGRES_DB:-hastina_db}
      JWT_SECRET: ${JWT_SECRET:-hastina_super_secure_jwt_secret_key_2026}
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-hastina_meili_master_key_2026}
      FRONTEND_URL: https://www.hastinamotorparts.com
      MAIL_FROM: sales@hastinamotorparts.com
    ports:
      - "4000:4000"
    networks:
      - hastina_network

  # 4. Next.js Web Frontend & Admin
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hastina_web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://api.hastinamotorparts.com/api/v1
      NEXT_PUBLIC_SITE_URL: https://www.hastinamotorparts.com
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-919811000000}
    ports:
      - "3000:3000"
    networks:
      - hastina_network

  # 5. Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: hastina_nginx
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - hastina_network

volumes:
  postgres_data:
  meili_data:

networks:
  hastina_network:
    driver: bridge
