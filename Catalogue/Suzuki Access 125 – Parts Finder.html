function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applic(r){
  var f=(r[3].match(/UZ125[A-Z]+/g)||[]).map(function(k){return FIGM[k]}).filter(Boolean);
  if(f.length)return f;
  var codes=(r[8].match(/\b(YKV|YUA|QZA|YLB|Q1S)\b/g)||[]);
  if(!codes.length){var pc=r[5].match(/-(YKV|YUA|QZA|YLB|Q1S)$/);if(pc)codes=[pc[1]];}
  if(codes.length){return Object.keys(MODELS).filter(function(m){return codes.some(function(c){return MODELS[m].col.indexOf(c)>-1})})}
  return Object.keys(MODELS);
}
function colorsOf(r){return (r[8].match(/\b(YKV|YUA|QZA|YLB|Q1S)\b/g)||[]).map(function(c){return c+" "+COL[c]})}

function modelCards(on){
